<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Three JS Room Configurator</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <div class="main">
            <div class="container">
                <canvas class="webgl"></canvas>
                <button class="menu-button">☰</button>
                <div class="configurator">
                    <div class="hide-large">
                        <button class="close-button">×</button>
                    </div>
                    <div class="configurator-sidebar">
                        <div class="menu active" data-content="home">Home</div>
                        <div class="menu" data-content="bed">Bed</div>
                        <div class="menu" data-content="sofa">Sofa</div>
                        <div class="menu" data-content="table">Table</div>
                        <div class="menu" data-content="cabinet">Cabinet</div>
                        <div class="menu" data-content="lighting">Lighting</div>
                        <div class="menu" data-content="bathroom">Bathroom</div>
                        <div class="menu" data-content="wall">
                            Wall / Divider
                        </div>
                    </div>
                    <div class="configurator-content"></div>
                </div>
                <div class="room-configurator frosted-background">
                    <div class="room-size-modal">
                        <div class="heading">
                            <div class="title">Dimensions</div>
                            <button class="close">X</button>
                        </div>
                        <div class="content">
                            <div
                                class="content-child"
                                data-dimension="room-width"
                                data-change-step="1"
                                data-change-min="5"
                                data-change-max="20"
                            >
                                <label for="width">Width</label>
                                <div class="content-child__action">
                                    <button class="subtract-btn">-</button>
                                    <div><span class="value">10</span>m</div>
                                    <button class="add-btn">+</button>
                                </div>
                            </div>
                            <div
                                class="content-child"
                                data-dimension="room-height"
                                data-change-step="0.5"
                                data-change-min="2.5"
                                data-change-max="5"
                            >
                                <label for="width">Height</label>
                                <div class="content-child__action">
                                    <button class="subtract-btn">-</button>
                                    <div><span class="value">2.5</span>m</div>
                                    <button class="add-btn">+</button>
                                </div>
                            </div>
                            <div
                                class="content-child"
                                data-dimension="room-depth"
                                data-change-step="1"
                                data-change-min="5"
                                data-change-max="20"
                            >
                                <label for="width">Depth</label>
                                <div class="content-child__action">
                                    <button class="subtract-btn">-</button>
                                    <div><span class="value">10</span>m</div>
                                    <button class="add-btn">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="floor-texture-modal">
                        <div class="heading">
                            <div class="title">Floor Texture</div>
                            <button class="close">X</button>
                        </div>
                        <div class="content">
                            <div class="textures-container">
                                <div class="texture">
                                    <div class="texture-name">Wood Floor</div>
                                    <img
                                        src="images/textures/wood-floor.webp"
                                        alt="wood floor image"
                                        data-texture-map="wood-floor"
                                        class="texture-img active"
                                    />
                                </div>
                                <div class="texture">
                                    <div class="texture-name">
                                        Rosewood Floor
                                    </div>
                                    <img
                                        src="images/textures/rosewood.webp"
                                        alt="rosewood floor image"
                                        data-texture-map="rosewood-floor"
                                        class="texture-img"
                                    />
                                </div>
                                <div class="texture">
                                    <div class="texture-name">
                                        Laminate Floor
                                    </div>
                                    <img
                                        src="images/textures/laminate-floor.webp"
                                        alt="laminate floor image"
                                        data-texture-map="laminate-floor"
                                        class="texture-img"
                                    />
                                </div>
                                <div class="texture">
                                    <div class="texture-name">Granite Tile</div>
                                    <img
                                        src="images/textures/granite-tile.webp"
                                        alt="granite tile floor image"
                                        data-texture-map="granite-tile"
                                        class="texture-img"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="room-configurator__actions">
                        <button
                            class="action-button"
                            data-configurator-action="room-size"
                        >
                            Room Size
                        </button>
                        <button
                            class="action-button"
                            data-configurator-action="floor-texture"
                        >
                            Floor Texture
                        </button>
                    </div>
                </div>
            </div>
            <div class="config-modal frosted-background">
                <div class="config-modal-title">
                    Selected: <span class="item-name"></span>
                </div>
                <div class="config-modal-description">
                    <div>Rotation: <span class="item-rotation">0</span>°</div>
                    <div class="config-modal-slider rotation">
                        <input
                            type="range"
                            id="model-rotation"
                            name="model rotation"
                            value="0"
                            min="0"
                            max="360"
                            step="5"
                        />
                    </div>
                    <div class="config-modal-slider--container__hidden">
                        <div>Width: <span class="item-width">0</span>m</div>
                        <div class="config-modal-slider width">
                            <input
                                type="range"
                                id="model-width"
                                name="model width"
                                value="3"
                                min="1"
                                max="9.9"
                                step="0.1"
                            />
                        </div>
                    </div>
                </div>
                <div class="config-modal-action">
                    <button
                        id="reset-btn"
                        class="action-button"
                        data-action-type="reset"
                    >
                        Reset
                    </button>
                    <button
                        id="delete-btn"
                        class="action-button"
                        data-action-type="delete"
                    >
                        Delete
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="/src/canvas.ts"></script>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>

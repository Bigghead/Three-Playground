<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Three JS Room Configurator</title>
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<div class="main">
			<div class="container">
				<canvas class="webgl"></canvas>
				<div class="configurator">
					<div class="configurator-sidebar">
						<div class="menu active" data-content="home">Home</div>
						<div class="menu" data-content="bed">Bed</div>
						<div class="menu" data-content="sofa">Sofa</div>
						<div class="menu" data-content="table">Table</div>
						<div class="menu" data-content="electronic">Electronic</div>
						<div class="menu" data-content="light">Light</div>
						<div class="menu" data-content="bathroom">Bathroom</div>
						<div class="menu" data-content="others">Others</div>
					</div>
					<div class="configurator-content"></div>
				</div>
			</div>
			<div class="config-modal">
				<div class="config-modal-title">
					Selected: <span class="item-name"></span>
				</div>
				<div class="config-modal-description">
					<div>Rotation: <span class="item-rotation">0</span>°</div>
					<div class="config-modal-slider">
						<input
							type="range"
							id="rotation"
							name="rotation"
							value="0"
							min="0"
							max="360"
							step="5"
						/>
					</div>
				</div>
				<div class="config-modal-action">
					<button>Reset</button>
					<button>Delete</button>
				</div>
			</div>
		</div>

		<script type="module" src="/src/canvas.ts"></script>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
